task_id: translation.zh-en
task_type: translation
task_version: v1
language_names:
  en: English
  zh: Chinese
dataset:
  repo: shisa-ai/bt_translation_set_global
  config: translation_zh_en_bidirectional_v1
  split: train
  revision: 1b0d3bcb2ed1a611ad9130cc474007afae2b598c
  hf_token_env: HF_TOKEN
compatibility:
  name_alias_mode: item_id_alias
  emit_legacy_english: false
compare_prompt_profile: compare-default-v1
compare_prompt_profiles:
  compare-default-v1:
    prompt_path: prompts/compare/default.txt
  compare-cn-v1:
    prompt_path: prompts/compare/cn.txt
directions:
  - key: zh_en
    source_language: zh
    target_language: en
    display_name: Chinese to English
    summary_language_label: zh_en
    translation_prompts:
      default: prompts/translate_prompt_from_chinese.txt
      low_context: prompts/translate_prompt_from_chinese_low_context.txt
      ultra_low_context: prompts/translate_prompt_from_chinese_ultra_low_context.txt
  - key: en_zh
    source_language: en
    target_language: zh
    display_name: English to Chinese
    summary_language_label: en_zh
    translation_prompts:
      default: prompts/translate_prompt_from_english_to_chinese.txt
      low_context: prompts/translate_prompt_from_english_to_chinese_low_context.txt
      ultra_low_context: prompts/translate_prompt_from_english_to_chinese_ultra_low_context.txt
scoring:
  direction_order:
    - zh_en
    - en_zh
