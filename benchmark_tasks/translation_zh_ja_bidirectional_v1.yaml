task_id: translation.zh-ja
task_type: translation
task_version: v1
language_names:
  ja: Japanese
  zh: Chinese
dataset:
  repo: shisa-ai/bt_translation_set_global
  config: translation_zh_ja_bidirectional_v1
  split: train
  revision: ead55791383dd96468692a8883b88af865416845
  hf_token_env: HF_TOKEN
compatibility:
  name_alias_mode: item_id_alias
  emit_legacy_english: false
compare_prompt_profile: compare-default-v1
compare_prompt_profiles:
  compare-default-v1:
    prompt_path: prompts/compare/default.txt
  compare-cn-v1:
    prompt_path: prompts/compare/cn.txt
directions:
  - key: zh_ja
    source_language: zh
    target_language: ja
    display_name: Chinese to Japanese
    summary_language_label: zh_ja
    translation_prompts:
      default: prompts/translate/default.txt
      low_context: prompts/translate/default.txt
      ultra_low_context: prompts/translate/default.txt
  - key: ja_zh
    source_language: ja
    target_language: zh
    display_name: Japanese to Chinese
    summary_language_label: ja_zh
    translation_prompts:
      default: prompts/translate/default.txt
      low_context: prompts/translate/default.txt
      ultra_low_context: prompts/translate/default.txt
scoring:
  direction_order:
    - zh_ja
    - ja_zh
